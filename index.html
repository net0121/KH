
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kingdom Hearts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cabinet">
    <button id="muteBtn" class="mute-btn" type="button" aria-label="Mute sound">🔊</button>

    <header class="hud">
      <div class="hud-stat">
        <div class="hud-label">SCORE</div>
        <div id="score" class="hud-value">0</div>
        <div class="stat-track"><div id="xpFill" class="stat-fill xp-fill"></div></div>
      </div>
      <div class="hud-stat hud-stat--right">
        <div class="hud-label">LVL <span id="levelDisplay">1</span> MP</div>
        <div class="stat-track"><div id="mpFill" class="stat-fill mp-fill"></div></div>
        <div class="stat-track" style="margin-top:2px;"><div id="hpFill" class="stat-fill hp-fill"></div></div>
      </div>
      <div class="hud-combo">
        <div id="comboCount">0x COMBO</div>
        <div class="combo-track"><div id="comboFill" class="combo-fill"></div></div>
      </div>
      <div class="hud-stat hud-stat--right">
        <div class="hud-label">TIME</div>
        <div id="time" class="hud-value">60</div>
      </div>
    </header>

    <div id="arena" class="arena"></div>

    <footer class="statusbar">
      <span id="statusText">Select or press Magic button to cast spells!</span>
      <button id="magicBtn" class="magic-btn" type="button" aria-haspopup="menu" aria-controls="spellMenu">MAGIC</button>
      <span>HIGH SCORE: <strong id="highscore">0</strong></span>
    </footer>
  </div>

  <div id="spellMenu" class="spell-menu overlay--hidden">
    <div class="spell-item selected">Fire</div>
    <div class="spell-item">Blizzard</div>
    <div class="spell-item">Thunder</div>
    <div class="spell-item">Cure</div>
    <div class="spell-item">Reflect</div>
    <div class="spell-item">Magnet</div>
    <div class="spell-item">Stop</div>
    <div class="spell-item">Aero</div>
  </div>

  <div id="startOverlay" class="overlay">
    <div class="overlay-card">
      <h1>KH Test</h1>
      <p>Poof the heartless before time runs out! Click or tap target entities to strike.</p>
      <button id="startBtn" class="btn" type="button">START HUNT</button>
    </div>
  </div>

  <div id="endOverlay" class="overlay overlay--hidden">
    <div class="overlay-card">
      <h1 id="endHeading">TIME'S UP!</h1>
      <p class="final-score">FINAL SCORE: <span id="finalScore">0</span></p>
      <p id="newBestNote" class="new-best-note overlay--hidden">★ NEW HIGH SCORE! ★</p>
      <button id="restartBtn" class="btn" type="button">PLAY AGAIN</button>
    </div>
  </div>

  <script src="enemies.js"></script>
  <script src="game.js"></script>
</body>
</html>
